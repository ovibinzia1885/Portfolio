{% url 'core:home' as home_url %}
{% with app=request.resolver_match.app_name %}
<nav class="navbar navbar-expand-lg navbar-portfolio fixed-top" aria-label="Main navigation">
  <div class="container">
    <a class="navbar-brand" href="{{ home_url }}">
      <span class="brand-mark"><i class="bi bi-code-slash"></i></span>
      <span class="d-none d-sm-inline">{{ site_name }}</span>
    </a>

    <div class="d-flex align-items-center gap-2 order-lg-last">
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme"><i class="bi bi-sun"></i></button>
      <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <i class="bi bi-list fs-4"></i>
      </button>
    </div>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-lg-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" data-spy="about" href="{{ home_url }}#about">About</a></li>
        <li class="nav-item"><a class="nav-link" data-spy="education" href="{{ home_url }}#education">Education</a></li>
        <li class="nav-item"><a class="nav-link" data-spy="experience" href="{{ home_url }}#experience">Experience</a></li>
        <li class="nav-item"><a class="nav-link" data-spy="skills" href="{{ home_url }}#skills">Skills</a></li>
        <li class="nav-item"><a class="nav-link {% if app == 'projects' %}active{% endif %}" data-spy="projects" href="{{ home_url }}#projects">Projects</a></li>
        <li class="nav-item"><a class="nav-link {% if app == 'blogs' %}active{% endif %}" href="{% url 'blogs:list' %}">Blog</a></li>
        <li class="nav-item"><a class="nav-link {% if app == 'research' %}active{% endif %}" href="{% url 'research:list' %}">Research</a></li>
        <li class="nav-item"><a class="nav-link {% if app == 'contact' %}active{% endif %}" data-spy="contact" href="{{ home_url }}#contact">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>
{% endwith %}
