{# Mobile / tablet (< 1200px): fixed top bar + off-canvas menu. Desktop uses the sidebar in base.html. #}
<header class="topbar d-xl-none">
  <a class="side-brand" href="{% url 'core:home' %}">
    {% if profile and profile.photo %}<img src="{{ profile.photo.url }}" alt="" width="42" height="42">{% else %}<span class="brand-mark">{{ site_name|slice:":1"|upper }}</span>{% endif %}
    <span><strong>{{ site_name }}</strong></span>
  </a>
  <div class="d-flex gap-2">
    <button class="icon-btn theme-toggle" type="button" aria-label="Toggle theme"><i class="bi bi-sun"></i></button>
    <button class="icon-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileNav" aria-controls="mobileNav" aria-label="Open menu"><i class="bi bi-list fs-5"></i></button>
  </div>
</header>

<div class="offcanvas offcanvas-start sidebar-offcanvas d-xl-none" tabindex="-1" id="mobileNav" aria-label="Menu">
  <div class="offcanvas-body">
    <button type="button" class="btn-close ms-auto mb-2" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
    {% include "components/sidebar_inner.html" %}
  </div>
</div>
