{% if messages %}
<div class="toast-stack" role="region" aria-label="Notifications">
  {% for message in messages %}
  <div class="toast-p {{ message.tags }}" role="{% if message.level >= 40 %}alert{% else %}status{% endif %}">
    <i class="bi {% if message.level >= 40 %}bi-exclamation-octagon-fill{% elif message.level >= 30 %}bi-exclamation-triangle-fill{% elif message.level >= 25 %}bi-check-circle-fill{% else %}bi-info-circle-fill{% endif %}"></i>
    <div>{{ message }}</div>
    <button type="button" class="btn-close" aria-label="Close"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
