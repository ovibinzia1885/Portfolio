{# Single shared preview modal; filled by main.js from the clicked button's data-cert-* attributes. #}
<div class="modal fade preview-modal" id="certPreview" tabindex="-1" aria-labelledby="certPreviewTitle" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title h6 mb-0" id="certPreviewTitle">Certificate</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" data-cert-body></div>
      <div class="modal-footer">
        <a class="btn btn-ghost btn-sm" data-cert-open href="#" target="_blank" rel="noopener"><i class="bi bi-box-arrow-up-right me-1"></i>Open in new tab</a>
        <a class="btn btn-grad btn-sm" data-cert-download href="#" download><i class="bi bi-download me-1"></i>Download</a>
      </div>
    </div>
  </div>
</div>
