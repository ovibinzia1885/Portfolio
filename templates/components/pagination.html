{% load portfolio_extras %}
{% if page_obj.has_other_pages %}
<nav aria-label="Pagination" class="mt-5">
  <ul class="pagination justify-content-center mb-0">
    {% querystring_without 'page' as qs %}
    <li class="page-item {% if not page_obj.has_previous %}disabled{% endif %}">
      <a class="page-link" {% if page_obj.has_previous %}href="?page={{ page_obj.previous_page_number }}{{ qs }}"{% endif %} aria-label="Previous"><i class="bi bi-chevron-left"></i></a>
    </li>
    {% for num in page_obj.paginator.page_range %}
      <li class="page-item {% if num == page_obj.number %}active{% endif %}">
        <a class="page-link" href="?page={{ num }}{{ qs }}" {% if num == page_obj.number %}aria-current="page"{% endif %}>{{ num }}</a>
      </li>
    {% endfor %}
    <li class="page-item {% if not page_obj.has_next %}disabled{% endif %}">
      <a class="page-link" {% if page_obj.has_next %}href="?page={{ page_obj.next_page_number }}{{ qs }}"{% endif %} aria-label="Next"><i class="bi bi-chevron-right"></i></a>
    </li>
  </ul>
</nav>
{% endif %}
