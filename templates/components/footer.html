{% url 'core:home' as home_url %}
<footer class="site-footer">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <p class="meta mb-0">&copy; <span id="year">{% now "Y" %}</span> {{ site_name }}. All rights reserved.</p>
    <ul class="list-inline meta mb-0">
      <li class="list-inline-item"><a href="{% url 'blogs:list' %}">Blog</a></li>
      <li class="list-inline-item"><a href="{% url 'research:list' %}">Research</a></li>
      <li class="list-inline-item"><a href="{% url 'certifications:list' %}">Certifications</a></li>
      <li class="list-inline-item"><a href="{% url 'contact:contact' %}">Contact</a></li>
      {% if profile and profile.resume_is_pdf %}<li class="list-inline-item"><a href="{% url 'core:cv_preview' %}">Preview CV</a></li>{% endif %}
      {% if profile and profile.resume %}<li class="list-inline-item"><a href="{% url 'core:download_cv' %}">Download CV</a></li>{% endif %}
    </ul>
  </div>
</footer>
