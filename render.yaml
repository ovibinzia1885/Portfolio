# Render Blueprint: Dashboard > New > Blueprint > pick this repository.
# Site: https://nazmulhoqueovy.onrender.com  (free web service, Singapore)
# Database: Neon Postgres (free, not deleted for inactivity). Media files: Cloudinary (free).
# Values marked `sync: false` are asked for once in the Render dashboard; they are never stored in git.
services:
  - type: web
    name: nazmulhoqueovy
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 60 --access-logfile -
    healthCheckPath: /robots.txt
    envVars:
      - key: SECRET_KEY        # python -c "import secrets; print(secrets.token_urlsafe(64))"
        sync: false
      - key: DATABASE_URL      # Neon connection string (postgresql://…?sslmode=require)
        sync: false
      - key: CLOUDINARY_URL    # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
        sync: false
      - key: ADMIN_URL         # hard-to-guess admin path, e.g. ovy-panel-4821/
        sync: false
      - key: DEBUG
        value: "False"
      - key: TRUST_X_FORWARDED_FOR   # Render's proxy sets the real visitor address
        value: "True"
      - key: TIME_ZONE
        value: Asia/Dhaka
